name: Guardian validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: lumen10_guardian_ia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c requirements-runtime.lock -e '.[dev]'
      - run: python -m ruff check guardian tests agents scripts
      - run: python -m pytest -q
