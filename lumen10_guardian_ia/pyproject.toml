[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lumen10-guardian"
version = "0.1.0"
description = "Guardian local: observabilidade, Codex, PowerShell e VS Code"
authors = [{name = "Carlos Antonio de Oliveira Piquet"}]
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1", "psutil>=6,<8", "tzdata>=2025.1", "jsonschema>=4.23,<5", "cryptography>=45,<52"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
guardian = "guardian.cli:main"

[tool.setuptools.packages.find]
include = ["guardian*"]

[tool.setuptools.package-data]
guardian = ["web/*", "schemas/*", "powershell/*", "issuer-public.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
